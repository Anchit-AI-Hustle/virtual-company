name: watchdog
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      drill:
        description: 'Test the alert path: open and close a practice alert issue'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: watchdog
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: node scripts/watchdog.js
      - name: Record the change (this also triggers a fresh HQ deploy)
        if: steps.check.outputs.changed == 'yes'
        run: |
          git config user.name "watchdog"
          git config user.email "watchdog@users.noreply.github.com"
          git add company/health.json
          git commit -m "Watchdog: platform ${{ steps.check.outputs.status }}"
          for i in 1 2 3 4; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i*10))
          done
          exit 1
      - name: Tell the owner (one alert issue, opened on a problem and closed on recovery)
        if: always() && steps.check.outputs.problems_changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --label platform-alert --state open --json number --jq '.[0].number')
          if [ "${{ steps.check.outputs.status }}" = "problem" ]; then
            gh label create platform-alert --color B60205 --description "Raised by the watchdog" 2>/dev/null || true
            if [ -n "$open" ]; then gh issue comment "$open" --body-file /tmp/watchdog-report.md
            else gh issue create --title "Platform alert: something needs fixing" --label platform-alert --body-file /tmp/watchdog-report.md; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "$(cat /tmp/watchdog-report.md)"
          fi
      - name: Keep waiting decisions open (closing an issue is not an answer)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner=$(node -p "require('./company/config.json').owner.github")
          for f in company/approvals/*.json; do
            [ -e "$f" ] || continue
            st=$(node -p "require('./$f').status"); url=$(node -p "require('./$f').issueUrl || ''")
            [ "$st" = "pending" ] && [ -n "$url" ] || continue
            n=${url##*/}
            [ "$(gh api repos/${{ github.repository }}/issues/$n --jq .state)" = "closed" ] || continue
            labelled=$(gh api "repos/${{ github.repository }}/issues/$n/events?per_page=100" --jq "[.[] | select(.event==\"labeled\" and .actor.login==\"$owner\" and (.label.name==\"approved\" or .label.name==\"rejected\"))] | length")
            [ "$labelled" = "0" ] || continue
            answered=$(gh api "repos/${{ github.repository }}/issues/$n/comments?per_page=100" --jq "[.[] | select(.user.login==\"$owner\") | select(.body|test(\"^\\\\s*(approve|reject)\";\"i\"))] | length")
            [ "$answered" = "0" ] || continue
            gh api -X PATCH repos/${{ github.repository }}/issues/$n -f state=open >/dev/null
            gh api repos/${{ github.repository }}/issues/$n/comments -f body="Reopened because this decision is still waiting. Closing an issue does not tell the agents yes or no. To answer, write a comment here that starts with **approve** or **reject** (a note after the word is fine)." >/dev/null
            echo "reopened #$n"
          done
      - name: Alert drill (only when started by hand with drill = true)
        if: github.event_name == 'workflow_dispatch' && inputs.drill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create platform-alert --color B60205 --description "Raised by the watchdog" 2>/dev/null || true
          n=$(gh issue create --title "Platform alert drill: please ignore" --label platform-alert --body "This is a test of the alert path. Nothing is wrong. It closes itself straight away." | grep -o '[0-9]*$')
          gh issue close "$n" --comment "Drill finished: alerts can be opened and closed. Nothing is wrong."
          echo "drill issue #$n opened and closed"
